name: CI — Backend Checks

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # JOB 1: Conflict check
  conflict-check:
    name: Merge conflict check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect conflict markers
        run: |
          if git diff --check HEAD; then
            echo "✅ No conflict markers found"
          else
            echo "❌ Conflict markers detected in code!"
            exit 1
          fi

  # JOB 2: Lint (Optional/If Present)
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: conflict-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if configured)
        run: npm run lint --if-present

  # JOB 3: Tests + MongoDB
  test:
    name: Tests (Node + MongoDB)
    runs-on: ubuntu-latest
    needs: lint
    # Fail fast instead of hanging for hours if something (DB, a test) gets stuck.
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/testdb
      PORT: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # mongosh is NOT installed on the runner host (only inside the service
      # container), so probe the port with netcat instead — otherwise the job
      # hangs here forever and never reaches the tests.
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 27017 && echo "✅ MongoDB is ready" && exit 0
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done
          echo "❌ MongoDB did not become ready in time"
          exit 1

      - name: Run tests
        run: npm test


